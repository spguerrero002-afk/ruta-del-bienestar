<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0865ce">
  <meta name="description" content="Ruta de Bienestar, prototipo académico de información y seguridad para micros y combis.">
